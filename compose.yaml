services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mailtrace-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailtrace-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped